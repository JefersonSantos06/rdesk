name: Mobile

# The phone app, on branch pushes that touch it: analyze the Dart code and build one APK
# (arm64, release, signed with the debug key: no secrets here). The other processors and
# the iPhone build run only for releases: each one is another full Rust build, and macOS
# minutes are expensive.
on:
  push:
    branches: ["**"]
    paths: ["mobile/**", "crates/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "crates/mobile/**"]

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          # Cargokit builds the Rust side into Flutter's build folder, not target/.
          workspaces: ". -> mobile/build/rust_lib_rdesk/build"
      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze lib
      # A debug build would compile the Rust side for arm64, x86 and x64 (cargokit always
      # adds the emulators' to debug builds); a release build for one processor is one.
      - name: Build the APK (arm64)
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
