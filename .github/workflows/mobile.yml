name: Mobile

# The phone app, on branch pushes that touch it: analyze the Dart code and build a debug
# APK. (The iPhone build runs only for releases: macOS minutes are expensive.)
on:
  push:
    branches: ["**"]
    paths: ["mobile/**", "crates/mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", "crates/mobile/**"]

concurrency:
  group: mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Analyze
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze lib
      - name: Build a debug APK
        working-directory: mobile
        run: flutter build apk --debug
