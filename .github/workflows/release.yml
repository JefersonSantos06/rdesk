name: Release

# Pushing a tag v1.2.3 (equal to the workspace version) builds every platform, writes and
# signs release.json and publishes a GitHub Release. See docs/RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            part: app
          # The app needs PipeWire 1.x headers (screen capture on Wayland): Ubuntu 24.04,
          # glibc 2.39. Runs on Ubuntu 24.04+, Debian 13 and Raspberry Pi OS (trixie).
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: app
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            part: app
          # Apple Silicon (macos-latest is arm64; older labels get retired).
          - os: macos-latest
            platform: macos-aarch64
            part: app
          # The server is plain Rust: Ubuntu 22.04 (glibc 2.35) also covers Debian 12 VPSs.
          - os: ubuntu-22.04
            platform: linux-x86_64
            part: server
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            part: server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.part }}
      - name: Linux system libraries
        if: runner.os == 'Linux' && matrix.part == 'app'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxdo-dev             libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev             libxkbcommon-dev libgtk-3-dev clang

      # The app (client + host)
      - name: Test
        if: matrix.part == 'app'
        run: cargo test --workspace --locked
      - name: Build the app
        if: matrix.part == 'app'
        run: cargo build --release --locked -p rdesk
      - name: Package (Windows)
        if: matrix.part == 'app' && runner.os == 'Windows'
        run: |
          mkdir dist
          7z a "dist/rdesk-$VERSION-${{ matrix.platform }}.zip" ./target/release/rdesk.exe
          # Also on its own: the server's download page hands it out as rdesk@server.exe.
          cp target/release/rdesk.exe "dist/rdesk-$VERSION-${{ matrix.platform }}.exe"
      - uses: taiki-e/install-action@v2
        if: matrix.part == 'app' && runner.os == 'Linux'
        with:
          tool: cargo-deb
      - name: Package (Linux)
        if: matrix.part == 'app' && runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/rdesk-$VERSION-${{ matrix.platform }}.tar.gz" -C target/release rdesk
          cargo deb -p rdesk --no-build --output dist/

      # macOS: rdesk.app, signed ad hoc (not by Apple: the first launch needs right-click → Open).
      - name: Package (macOS)
        if: matrix.part == 'app' && runner.os == 'macOS'
        run: |
          mkdir -p dist stage/rdesk.app/Contents/MacOS
          cp target/release/rdesk stage/rdesk.app/Contents/MacOS/rdesk
          cat > stage/rdesk.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>dev.rdesk.rdesk</string>
            <key>CFBundleName</key><string>rdesk</string>
            <key>CFBundleDisplayName</key><string>rdesk</string>
            <key>CFBundleExecutable</key><string>rdesk</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - stage/rdesk.app
          codesign --verify --verbose stage/rdesk.app
          tar -czf "dist/rdesk-$VERSION-${{ matrix.platform }}.tar.gz" -C stage rdesk.app

      # The server
      - name: Test and build the server
        if: matrix.part == 'server'
        run: |
          cargo test --locked -p rdesk-server -p rdesk-proto -p rdesk-release
          cargo build --release --locked -p rdesk-server
      - name: Package the server
        if: matrix.part == 'server'
        run: |
          mkdir dist
          tar -czf "dist/rdesk-server-$VERSION-${{ matrix.platform }}.tar.gz"             -C target/release rdesk-server -C "$GITHUB_WORKSPACE/deploy" rdesk-server.service \
            rdesk-server-update.path rdesk-server-update.service

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.part }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Put RDESK_RELEASE_KEY in this environment's secrets; required reviewers here make
    # every release wait for your approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build rdesk-release
        run: cargo build --locked -p rdesk-release
      - name: Manifest
        run: ./target/debug/rdesk-release manifest --version "${GITHUB_REF_NAME#v}" --dir dist
      - name: Sign
        env:
          RDESK_RELEASE_KEY: ${{ secrets.RDESK_RELEASE_KEY }}
        run: ./target/debug/rdesk-release sign --dir dist
      - name: Verify against the keys built into the app
        run: ./target/debug/rdesk-release verify --dir dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "rdesk ${GITHUB_REF_NAME#v}" --generate-notes
