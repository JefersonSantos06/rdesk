name: Release

# Pushing a tag v1.2.3 (equal to the workspace version) builds every platform, writes and
# signs release.json and publishes a GitHub Release. See docs/RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            part: app
          # The app needs PipeWire 1.x headers (screen capture on Wayland): Ubuntu 24.04,
          # glibc 2.39. Runs on Ubuntu 24.04+, Debian 13 and Raspberry Pi OS (trixie).
          - os: ubuntu-24.04
            platform: linux-x86_64
            part: app
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            part: app
          # Apple Silicon (macos-latest is arm64; older labels get retired).
          - os: macos-latest
            platform: macos-aarch64
            part: app
          # The server is plain Rust: Ubuntu 22.04 (glibc 2.35) also covers Debian 12 VPSs.
          - os: ubuntu-22.04
            platform: linux-x86_64
            part: server
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
            part: server
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.part }}
      - name: Linux system libraries
        if: runner.os == 'Linux' && matrix.part == 'app'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxdo-dev             libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev             libxkbcommon-dev libgtk-3-dev libasound2-dev cmake clang

      # The app (client + host)
      - name: Test
        if: matrix.part == 'app'
        run: cargo test --workspace --locked
      - name: Build the app
        if: matrix.part == 'app'
        run: cargo build --release --locked -p rdesk
      - name: Package (Windows)
        if: matrix.part == 'app' && runner.os == 'Windows'
        run: |
          mkdir dist
          7z a "dist/rdesk-$VERSION-${{ matrix.platform }}.zip" ./target/release/rdesk.exe
          # Also on its own: the server's download page hands it out as rdesk@server.exe.
          cp target/release/rdesk.exe "dist/rdesk-$VERSION-${{ matrix.platform }}.exe"
      - uses: taiki-e/install-action@v2
        if: matrix.part == 'app' && runner.os == 'Linux'
        with:
          tool: cargo-deb
      - name: Package (Linux)
        if: matrix.part == 'app' && runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/rdesk-$VERSION-${{ matrix.platform }}.tar.gz" -C target/release rdesk
          cargo deb -p rdesk --no-build --output dist/

      # macOS: rdesk.app, signed with rdesk's own certificate (not Apple's: the first launch
      # needs right-click → Open). Always the same certificate, so macOS keeps Screen Recording
      # and Accessibility across updates; signed ad hoc (a new identity each version, so the
      # permissions are asked again) only without it. See docs/RELEASE.md.
      - name: Package (macOS)
        if: matrix.part == 'app' && runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.RDESK_MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.RDESK_MACOS_CERT_PASSWORD }}
        run: |
          mkdir -p dist stage/rdesk.app/Contents/MacOS
          cp target/release/rdesk stage/rdesk.app/Contents/MacOS/rdesk
          cat > stage/rdesk.app/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>dev.rdesk.rdesk</string>
            <key>CFBundleName</key><string>rdesk</string>
            <key>CFBundleDisplayName</key><string>rdesk</string>
            <key>CFBundleExecutable</key><string>rdesk</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # The certificate into a keychain of its own. Inside an `if`, so a failure (a wrong
          # password, say) falls back to ad hoc instead of failing the release.
          identity=""
          kc="$RUNNER_TEMP/rdesk-signing.keychain-db"
          kcpass=$(openssl rand -hex 16)
          p12="$RUNNER_TEMP/rdesk-signing.p12"
          if [ -n "$CERT_P12" ] \
            && echo "$CERT_P12" | base64 --decode > "$p12" \
            && security create-keychain -p "$kcpass" "$kc" \
            && security set-keychain-settings -lut 3600 "$kc" \
            && security unlock-keychain -p "$kcpass" "$kc" \
            && security import "$p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign \
            && security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null \
            && security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"'); then
            # Self-signed, so not "valid" for the system: picked by its hash.
            identity=$(security find-identity -p codesigning "$kc" | grep -m1 -oE '[0-9A-F]{40}' || true)
          fi
          rm -f "$p12"
          if [ -n "$identity" ] && codesign --force --deep --sign "$identity" stage/rdesk.app; then
            echo "signed with rdesk's certificate $identity"
          else
            echo "::warning::rdesk.app signed ad hoc (no RDESK_MACOS_CERT_P12_B64, or it failed): Macs will ask for the permissions again after this update"
            codesign --force --deep --sign - stage/rdesk.app
          fi
          codesign --verify --verbose stage/rdesk.app
          # What macOS remembers the permissions by.
          codesign --display --requirements - stage/rdesk.app
          tar -czf "dist/rdesk-$VERSION-${{ matrix.platform }}.tar.gz" -C stage rdesk.app

      # The server
      - name: Test and build the server
        if: matrix.part == 'server'
        run: |
          cargo test --locked -p rdesk-server -p rdesk-proto -p rdesk-release
          cargo build --release --locked -p rdesk-server
      - name: Package the server
        if: matrix.part == 'server'
        run: |
          mkdir dist
          tar -czf "dist/rdesk-server-$VERSION-${{ matrix.platform }}.tar.gz"             -C target/release rdesk-server -C "$GITHUB_WORKSPACE/deploy" rdesk-server.service \
            rdesk-server-update.path rdesk-server-update.service

      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.part }}
          path: dist/*
          if-no-files-found: error

  # The phone apps: an APK for Android (signed with the project's release key, so each
  # version updates the last) and an unsigned IPA for iPhone (signed when sideloaded).
  # See mobile/README.md.
  mobile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Android's version code must grow with every release.
          echo "BUILD_NUMBER=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'android' && 'aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android' || 'aarch64-apple-ios' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}
      - name: The release signing key (Android)
        if: matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.RDESK_ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::RDESK_ANDROID_KEYSTORE_B64 is not set: an APK signed with another key could not update the installed app (see mobile/README.md)"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/rdesk-release.jks"
          echo "RDESK_ANDROID_KEYSTORE=$RUNNER_TEMP/rdesk-release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        if: matrix.platform == 'android'
        working-directory: mobile
        env:
          RDESK_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.RDESK_ANDROID_KEYSTORE_PASSWORD }}
          RDESK_ANDROID_KEY_ALIAS: ${{ secrets.RDESK_ANDROID_KEY_ALIAS }}
          RDESK_ANDROID_KEY_PASSWORD: ${{ secrets.RDESK_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/rdesk-$VERSION-android.apk"
      - name: Build the IPA (unsigned)
        if: matrix.platform == 'ios'
        working-directory: mobile
        run: |
          flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$BUILD_NUMBER"
          mkdir -p Payload ../dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../dist/rdesk-$VERSION-ios.ipa" Payload
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.platform }}-app
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [build, mobile]
    runs-on: ubuntu-latest
    # Put RDESK_RELEASE_KEY in this environment's secrets; required reviewers here make
    # every release wait for your approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build rdesk-release
        run: cargo build --locked -p rdesk-release
      - name: Manifest
        run: ./target/debug/rdesk-release manifest --version "${GITHUB_REF_NAME#v}" --dir dist
      - name: Sign
        env:
          RDESK_RELEASE_KEY: ${{ secrets.RDESK_RELEASE_KEY }}
        run: ./target/debug/rdesk-release sign --dir dist
      - name: Verify against the keys built into the app
        run: ./target/debug/rdesk-release verify --dir dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "rdesk ${GITHUB_REF_NAME#v}" --generate-notes
