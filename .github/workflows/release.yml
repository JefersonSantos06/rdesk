name: Release

# Pushing a tag v1.2.3 (equal to the workspace version) builds every platform, writes and
# signs release.json and publishes a GitHub Release. See docs/RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          # Ubuntu 22.04 (glibc 2.35): the binaries also run on Debian 12 and Raspberry Pi OS.
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-22.04-arm
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxdo-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxkbcommon-dev libgtk-3-dev clang
      - run: cargo test --workspace --locked
      - name: Build
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            cargo build --release --locked -p rdesk -p rdesk-server
          else
            cargo build --release --locked -p rdesk
          fi
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          7z a "dist/rdesk-$VERSION-${{ matrix.platform }}.zip" ./target/release/rdesk.exe
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          tar -czf "dist/rdesk-$VERSION-${{ matrix.platform }}.tar.gz" -C target/release rdesk
          tar -czf "dist/rdesk-server-$VERSION-${{ matrix.platform }}.tar.gz" \
            -C target/release rdesk-server -C "$GITHUB_WORKSPACE/deploy" rdesk-server.service
          cargo deb -p rdesk --no-build --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Put RDESK_RELEASE_KEY in this environment's secrets; required reviewers here make
    # every release wait for your approval.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Build rdesk-release
        run: cargo build --locked -p rdesk-release
      - name: Manifest
        run: ./target/debug/rdesk-release manifest --version "${GITHUB_REF_NAME#v}" --dir dist
      - name: Sign
        env:
          RDESK_RELEASE_KEY: ${{ secrets.RDESK_RELEASE_KEY }}
        run: ./target/debug/rdesk-release sign --dir dist
      - name: Verify against the keys built into the app
        run: ./target/debug/rdesk-release verify --dir dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "rdesk ${GITHUB_REF_NAME#v}" --generate-notes
