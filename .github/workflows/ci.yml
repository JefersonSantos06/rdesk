name: CI

# Branches only: a tag runs the Release workflow, which already tests what it builds.
# Changes to documentation alone run nothing.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A newer push to the same branch (or PR) cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest it supports (Ubuntu 22.04: glibc 2.35, PipeWire 0.3), like the release.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxdo-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxkbcommon-dev libgtk-3-dev libasound2-dev cmake clang
      # libspa needs PipeWire 0.3.65+ headers; Ubuntu 22.04 has 0.3.48 (the library stays its own).
      - name: PipeWire headers (Linux)
        if: runner.os == 'Linux'
        run: echo "PKG_CONFIG_PATH=$(.github/scripts/pipewire-headers.sh "$RUNNER_TEMP/pipewire")" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p rdesk
      # Debian 12 has glibc 2.36, Ubuntu 22.04 2.35: nothing may need a newer one.
      - name: glibc 2.35 at most
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/release/rdesk | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "rdesk needs glibc $need"
          # In order (sort -C) only when it is 2.35 or older.
          if ! printf '%s\n' "$need" 2.35 | sort -V -C; then
            echo "::error::rdesk needs glibc $need: it would not run on Ubuntu 22.04 / Debian 12"
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: rdesk-${{ matrix.os }}
          path: |
            target/release/rdesk
            target/release/rdesk.exe
          if-no-files-found: ignore
