name: CI

# Branches only: a tag runs the Release workflow, which already tests what it builds.
# Changes to documentation alone run nothing.
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A newer push to the same branch (or PR) cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxcb1-dev libxrandr-dev libxdo-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev \
            libxkbcommon-dev libgtk-3-dev libasound2-dev cmake clang
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p rdesk
      - uses: actions/upload-artifact@v6
        with:
          name: rdesk-${{ matrix.os }}
          path: |
            target/release/rdesk
            target/release/rdesk.exe
          if-no-files-found: ignore
