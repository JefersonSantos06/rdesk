[workspace]
resolver = "3"
members = ["crates/proto", "crates/common", "crates/core", "crates/host", "crates/client", "crates/mobile", "crates/rdesk", "crates/server", "crates/release"]

[workspace.package]
version = "0.10.1"
edition = "2024"
publish = false

[workspace.dependencies]
rdesk-proto = { path = "crates/proto" }
rdesk-common = { path = "crates/common" }
rdesk-core = { path = "crates/core" }
# Without its `screen` feature (a server with no screen): who needs the screen turns it on.
rdesk-host = { path = "crates/host", default-features = false }
rdesk-client = { path = "crates/client" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 4

# Image codecs are far too slow unoptimized; keep them fast in dev builds too.
[profile.dev.package."*"]
opt-level = 2
