[package]
name = "rdesk-client"
description = "rdesk client: connection manager and viewer window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
pollster = "0.4"
rfd = "0.18"
blake3 = "1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }
