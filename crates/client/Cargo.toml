[package]
name = "rdesk-client"
description = "rdesk client: connection manager and viewer window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
rdesk-host = { workspace = true, optional = true }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true

egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
pollster = "0.4"
rfd = "0.18"
keyring = "4.2"
tray-icon = { version = "0.26", default-features = false }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
directories = "6"
rand = "0.8"
blake3 = "1"
zeroize = "1"
rpassword = "7"
thiserror.workspace = true
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }

[features]
default = []
# Embed the host in the desktop app ("This computer" page).
host = ["dep:rdesk-host"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The KSNI tray backend talks D-Bus directly: no GTK / libappindicator needed.
[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[dev-dependencies]
rdesk-host.workspace = true
tempfile = "3"
