[package]
name = "rdesk-server"
description = "rdesk private server: accounts (OAuth + mandatory 2FA), sessions and the iroh relay"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "rdesk-server"
path = "src/main.rs"

[dependencies]
rdesk-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.8", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
rand = "0.8"
hex = "0.4.3"
sha2 = "0.10"
base64 = "0.23.1"
axum = "0.8.9"
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form"] }
totp-rs = { version = "6.0.0", features = ["qr", "gen_secret", "otpauth"] }
iroh-relay = { version = "1.5", default-features = false, features = ["server", "tls-ring"] }
iroh-base = "1.5"
axum-server = "0.8"
rustls-acme = { version = "0.15.4", default-features = false, features = ["axum", "ring", "webpki-roots", "tls12"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "tokio", "http1"] }
http-body-util = "0.1.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
futures = "0.3.34"
url = "2.5.8"
uuid = { version = "1.29.3", features = ["v4"] }
webauthn-rs = "0.6.2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query", "cookies"] }
iroh = { version = "1.5", default-features = false, features = ["tls-ring"] }
