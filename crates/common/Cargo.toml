[package]
name = "rdesk-common"
description = "Shared rdesk logic: iroh/QUIC transport, auth handshake, config, tile codec, file transfer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
tokio.workspace = true
tracing.workspace = true

# QUIC with hole punching and relays; `noq-proto` (iroh's QUIC) for the congestion controllers.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
noq-proto = { version = "1.4", default-features = false }
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"

ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std", "crypto"] }
ssh-agent-lib = "0.6"
opaque-ke = { version = "4", features = ["argon2"] }
argon2 = "0.5"
rpassword = "7"

directories = "6"
toml = "1"
serde_json = "1"
gethostname = "1"

arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
zstd = "0.13"
jpeg-encoder = "0.7"
zune-jpeg = "0.5"

[dev-dependencies]
tempfile = "3"
# An in-process relay for the end-to-end tests.
iroh-relay = { version = "1.4", default-features = false, features = ["server", "tls-ring"] }
rsa = { version = "0.9", features = ["sha2"] }
tokio = { workspace = true, features = ["test-util"] }
