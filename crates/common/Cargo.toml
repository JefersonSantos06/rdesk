[package]
name = "rdesk-common"
description = "Shared rdesk logic: iroh/QUIC transport, auth handshake, config, tile codec, file transfer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
tokio.workspace = true
tracing.workspace = true

# QUIC with hole punching and relays; `noq-proto` (iroh's QUIC) for the congestion controllers.
iroh = { version = "1.5", default-features = false, features = ["tls-ring", "portmapper", "fast-apple-datapath"] }
noq-proto = { version = "1.5", default-features = false }
# Optional: find hosts on the local network by mDNS (direct access without a server).
iroh-mdns-address-lookup = "0.6"
ring = "0.17"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"

ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std", "crypto"] }
# Device keys (a phone's secure hardware) sign in DER; ssh-key wants the raw pair.
p256 = { version = "0.13", features = ["ecdsa", "std"] }
ssh-agent-lib = "0.6"
opaque-ke = { version = "4", features = ["argon2"] }
argon2 = "0.5"
rpassword = "7"

directories = "6"
toml = "1"
serde_json = "1"
gethostname = "1"

zstd = "0.13"
png = "0.18"
# H.264 for whole-screen motion (Cisco's OpenH264, built from source).
openh264 = { version = "0.9", optional = true }
jpeg-encoder = "0.7"
zune-jpeg = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webbrowser = "1.2.7"
url = "2.5.8"
base64 = "0.23.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }

# Android: the HTTPS roots built into the app (see `account::http_client`), and H.264
# decoding by the phone's own decoder (`h264_android`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "1"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow", "api-level-26"] }

[dev-dependencies]
tempfile = "3"
# An in-process relay for the end-to-end tests.
iroh-relay = { version = "1.5", default-features = false, features = ["server", "tls-ring"] }
rsa = { version = "0.9", features = ["sha2"] }
tokio = { workspace = true, features = ["test-util"] }
rdesk-server = { path = "../server" }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "form", "cookies"] }
totp-rs = "6"
iroh-base = "1.5"

[features]
default = []
# H.264 (desktop host and client; not the phone app).
h264 = ["dep:openh264"]
