[package]
name = "rdesk-mobile"
description = "The phone app's Rust side: rdesk-core behind a flutter_rust_bridge API"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# cdylib: Android's librdesk_mobile.so; staticlib: linked into the iOS app.
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
rdesk-core.workspace = true
# This phone as a host (other devices connect to it).
rdesk-host.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
flutter_rust_bridge = "=2.13.0"
ssh-key = { version = "0.6", features = ["p256", "std"] }
p256 = { version = "0.13", features = ["ecdsa", "std"] }
zeroize = "1"

[lints.rust]
# flutter_rust_bridge's generated code uses this cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
