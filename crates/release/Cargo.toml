[package]
name = "rdesk-release"
description = "Builds and signs the release.json manifest of an rdesk release (used by CI)"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
