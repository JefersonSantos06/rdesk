[package]
name = "rdesk"
description = "Remote desktop over QUIC + Tailscale with 1Password-backed auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["host", "client"]
host = ["dep:rdesk-host"]
client = ["dep:rdesk-client"]

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
rdesk-host = { workspace = true, optional = true }
rdesk-client = { workspace = true, optional = true }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }
rpassword = "7"
zeroize = "1"
directories = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
rand = "0.8"
tempfile = "3"
