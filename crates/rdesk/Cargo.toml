[package]
name = "rdesk"
description = "Remote desktop over QUIC (iroh) with 1Password-backed auth"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["host", "client", "screen"]
host = ["dep:rdesk-host", "rdesk-client?/host"]
# The screen, keyboard, mouse and sound (Linux). Without it and without `client`, the host of
# a server reached by terminal, files and tunnels only (the rdesk-host package).
screen = ["host", "rdesk-host/screen"]
client = ["dep:rdesk-client", "dep:crossterm"]

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
rdesk-host = { workspace = true, optional = true }
rdesk-client = { workspace = true, optional = true }
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive", "env"] }
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }
rpassword = "7"
zeroize = "1"
serde_json = "1"
# `rdesk shell`: the local terminal in raw mode.
crossterm = { version = "0.29", optional = true }
directories = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Foundation"] }

[dev-dependencies]
rand = "0.8"
tempfile = "3"

# `cargo deb -p rdesk --no-build` (release workflow): rdesk_<version>_<arch>.deb
[package.metadata.deb]
maintainer = "Jeferson Santos"
copyright = "Jeferson Santos"
revision = ""
section = "net"
priority = "optional"
depends = "$auto"
extended-description = "Remote desktop over QUIC (iroh) with a private rdesk server: client and host in one app."
# Both put /usr/bin/rdesk in place: one or the other.
conflicts = "rdesk-host"
replaces = "rdesk-host"
assets = [
    ["target/release/rdesk", "usr/bin/", "755"],
    ["../../deploy/rdesk-update.service", "usr/lib/systemd/system/", "644"],
    ["../../deploy/rdesk-update.timer", "usr/lib/systemd/system/", "644"],
    ["../../deploy/rdesk-host.service", "usr/lib/systemd/user/", "644"],
    # The applications menu entry and its icon.
    ["../../deploy/rdesk.desktop", "usr/share/applications/", "644"],
    ["../../deploy/rdesk.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

# `cargo deb -p rdesk --variant host --no-build`, after building it with
# `--no-default-features --features host` (release workflow): rdesk-host_<version>_<arch>.deb,
# the host of a server without a screen, with no app and no desktop libraries.
[package.metadata.deb.variants.host]
default-features = false
features = ["host"]
extended-description = "The rdesk host for a server without a screen: reached from the rdesk app by terminal, files and port tunnels, with no app and no desktop libraries. Run it with rdesk-host@<user>.service."
conflicts = "rdesk"
replaces = "rdesk"
assets = [
    ["target/release/rdesk", "usr/bin/", "755"],
    ["../../deploy/rdesk-update.service", "usr/lib/systemd/system/", "644"],
    ["../../deploy/rdesk-update.timer", "usr/lib/systemd/system/", "644"],
    ["../../deploy/rdesk-host@.service", "usr/lib/systemd/system/", "644"],
]
