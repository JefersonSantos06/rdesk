[package]
name = "rdesk-host"
description = "rdesk host: screen capture, input injection, clipboard and file service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

xcap = "0.9"
rayon = "1"
blake3 = "1"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }
hex = "0.4"
serde_json = "1"

# Windows injects input with SendInput directly (scancodes), so enigo is only for macOS/Linux.
[target.'cfg(not(windows))'.dependencies]
enigo = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Power", "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    # The Windows service: sessions, desktops, tokens, processes, pipes, the notice window.
    "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Environment",
    "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Memory",
] }
windows-service = "0.8"

[dev-dependencies]
iroh-base = "1.5"
rdesk-server = { path = "../server" }
tempfile = "3"
