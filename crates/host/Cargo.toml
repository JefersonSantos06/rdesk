[package]
name = "rdesk-host"
description = "rdesk host: screen capture, input injection, clipboard and file service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
rdesk-proto.workspace = true
rdesk-common.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true

rayon = "1"
blake3 = "1"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "std"] }
hex = "0.4"
serde_json = "1"
# Direct access: which addresses share a network with this computer.
netwatch = "0.20"
# Network cards (for Wake-on-LAN); the version netwatch already uses.
netdev = { version = "0.47", default-features = false }
ipnet = "2"
# Remote terminal: ConPTY on Windows, a pty elsewhere.
portable-pty = "0.9"

# Windows and Mac computers: always their screen, keyboard and sound (phones use their own
# system APIs; Linux has them with the `screen` feature).
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_os = "linux")))'.dependencies]
# H.264 for motion (OpenH264, C++ built from source); phones keep to tiles for now.
rdesk-common = { workspace = true, features = ["h264"] }
# Screen capture.
xcap = "0.9"
# Sound: Opus (libopus built from source with CMake). Phones send no sound yet.
opus = "0.4"

# Android: H.264 by the phone's hardware encoder (MediaCodec, NDK).
[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", default-features = false, features = ["media", "api-level-26"] }

# Windows injects input with SendInput directly (scancodes), so enigo is only for macOS/Linux.
[target.'cfg(target_os = "macos")'.dependencies]
enigo = "0.6"

# Linux with the `screen` feature: the same as above, plus Wayland (screen and input through
# the desktop portal, frames over PipeWire) and X11's Caps Lock and Num Lock.
[target.'cfg(target_os = "linux")'.dependencies]
xcap = { version = "0.9", optional = true }
opus = { version = "0.4", optional = true }
enigo = { version = "0.6", optional = true }
ashpd = { version = "0.14", default-features = false, features = ["async-io", "pipewire", "remote_desktop", "screencast"], optional = true }
pipewire = { version = "0.10", optional = true }
pollster = { version = "1", optional = true }
# The version enigo already uses.
x11rb = { version = "0.13", optional = true }

[target.'cfg(windows)'.dependencies]
# The speakers' sound (WASAPI loopback).
cpal = "0.18"
# Screen capture with DXGI Desktop Duplication (the same version xcap already builds).
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_Power", "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading",
    # The Windows service: sessions, desktops, tokens, processes, pipes, the notice window.
    "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Environment",
    "Win32_System_Pipes", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_System_Memory", "Win32_Graphics_Dwm",
] }
windows-service = "0.8"

[features]
default = ["screen"]
# A Linux computer's screen, keyboard, mouse and sound (X11 and Wayland). Without it, a server
# reached only by terminal, files and tunnels, with no X11, PipeWire or sound libraries to
# install. Windows and Mac computers always have them; phones bring their own.
screen = ["rdesk-common/h264", "dep:xcap", "dep:opus", "dep:enigo", "dep:ashpd", "dep:pipewire", "dep:pollster", "dep:x11rb"]

[dev-dependencies]
iroh-base = "1.5"
rdesk-server = { path = "../server" }
rdesk-core = { workspace = true, features = ["h264"] }
tempfile = "3"
